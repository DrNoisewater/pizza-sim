# Builds the Windows installer and portable .exe whenever you push to GitHub
# (or when you press "Run workflow" on the Actions tab). Download the files from
# the finished run's "Artifacts" section.
name: Build Windows game

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: PizzaSIM-Windows
          path: |
            release/*.exe
          if-no-files-found: error
